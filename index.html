<style>
/* @@MODULE: tokens-css | step 01 */
:root{
  --canvas:#F7F8FA;--surface:#FFFFFF;--line:#E5E8EC;--ink:#1F2937;--muted:#6B7280;
  --accent:#2F6B8A;--accent-tint:#E8F1F6;--on-accent:#FFFFFF;
  --waiting:#B7791F;--waiting-bg:#FBF3E2;--progress:#2F6B8A;--progress-bg:#E8F1F6;
  --done:#3F8F6B;--done-bg:#E6F3EC;--urgent:#C2453D;--urgent-bg:#FBEAE8;
  --r:12px;--r-chip:6px;--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:24px;
}
/* @@END: tokens-css */
/* @@MODULE: base-css | step 01 */
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 15px/22px Inter,system-ui,sans-serif}
h1,h2,h3,p{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.material-symbols-outlined{font-size:24px;line-height:1;user-select:none}
.muted{color:var(--muted)}.cap{font:400 13px/18px Inter}.hint{font:400 13px/18px Inter;color:var(--muted)}
.title{font:600 22px/28px Inter;letter-spacing:-.01em}.sect{font:600 17px/24px Inter;letter-spacing:-.005em}
.grow{flex:1;min-width:0}
/* @@END: base-css */
/* @@MODULE: comp-css | step 01 */
.btn{height:48px;border-radius:var(--r);font:500 15px/22px Inter;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-sm);padding-inline:var(--sp-lg);border:1px solid transparent}
.btn-full{width:100%}.btn-lg{height:52px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-destructive{background:var(--surface);color:var(--urgent);border-color:var(--urgent-bg)}
.iconbtn{position:relative;width:48px;height:48px;border:0;background:none;border-radius:50%;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.iconbtn .dot{position:absolute;top:12px;inset-inline-end:12px;width:8px;height:8px;border-radius:50%;background:var(--urgent)}
.field{display:flex;flex-direction:column;gap:6px}
.lblrow{display:flex;justify-content:space-between;align-items:center}
.lblrow label{font:500 13px/18px Inter}.req{color:var(--urgent);margin-inline-start:4px}
.ctl{width:100%;height:48px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding-inline:var(--sp-md);font:400 15px/22px Inter;color:var(--ink);outline:0}
.ctl::placeholder{color:var(--muted)}
.ctl:focus{border-color:var(--accent);outline:.5px solid var(--accent)}
textarea.ctl{height:auto;padding-block:var(--sp-md);resize:none}
.selwrap{position:relative;display:flex;align-items:center}
.selwrap .ctl{appearance:none;padding-inline-end:40px}
.selwrap .material-symbols-outlined{position:absolute;inset-inline-end:12px;font-size:20px;color:var(--muted);pointer-events:none}

    }).catch(e => { if (!dead) setCam(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') ? 'denied' : 'none'); });
    return () => { dead = true; stop(); };
  }, [camOn, facing]);
  const flash = async () => {
    const tr = stream.current && stream.current.getVideoTracks()[0]; if (!tr) return;
    try { await tr.applyConstraints({ advanced: [{ torch: !torch }] }); setTorch(!torch); } catch (e) { /* torch not allowed: ignore */ }
  };
  const find = async p => {
    const n = normalizePlate(p);
    if (n.length < 2) { setMsg('sc.enter'); setRes(null); return; }
    setBusy(true); setMsg('');
    try { const items = await scFind(n); setRes({ plate: n, items }); setRecent(scRemember(n)); }
    catch (e) { setRes(null); setMsg(navigator.onLine ? 'sc.find_err' : 'net.offline'); }
    setBusy(false);
  };
  const scan = async job => {
    setBusy(true); setMsg(''); setRes(null); setRead(null);
    try {
      const d = await scRead(await job);
      if (!d.found) { setMsg('sc.none_read'); setBusy(false); return; }
      setVal(d.plate); setRead({ plate: d.plate, score: d.score });
      await find(d.plate);
    } catch (e) { setMsg(SC_ERR[e && e.code] || 'sc.err_unavail'); setBusy(false); }
  };
  const onFile = e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) scan(resizePhoto(f)); };
  const back = () => { if (history.length > 1) history.back(); else location.hash = (ROLE_NAV[role] || ROLE_NAV.employee)[0].key; };
  const live = cam === 'on', items = res ? res.items : [];
  const statusText = busy ? t('sc.reading') : cam === 'starting' ? t('sc.starting') : live ? t('sc.align') : t(camOn ? 'sc.cam_none' : 'sc.cam_off');
  const camMsg = cam === 'denied' ? 'sc.cam_denied' : cam === 'none' ? 'sc.cam_none' : cam === 'off' ? 'sc.cam_off' : '';
  const photoBtn = html`<label class="sc-shot"><${Icon} n="photo_camera"/>${t('sc.take')}<input class="sc-hide" type="file" accept="image/*" capture="environment" disabled=${busy} onChange=${onFile}/></label>`;
  return html`<div class="sc">
    <div class="sc-head"><${IconButton} icon="arrow_back" label=${t('common.back')} onClick=${back}/><div class="grow"><h2 class="sect">${t('sc.title')}</h2><p class="cap">${t('sc.sub')}</p></div>
      <button type="button" class="sc-tog" aria-pressed=${camOn} onClick=${() => setCamOn(!camOn)}><${Icon} n=${camOn ? 'photo_camera' : 'no_photography'}/>${t(camOn ? 'sc.on' : 'sc.off')}</button></div>
    <div class="sc-cam"><video ref=${vref} playsinline muted autoplay aria-hidden="true"></video><div class="sc-scrim"></div>
      <div class="sc-top"><span class=${'sc-st' + (busy ? ' rd' : '')} role="status"><i></i>${statusText}</span>
        <div class="sc-tools">${live && canTorch && html`<button type="button" class=${'sc-round' + (torch ? ' on' : '')} aria-label=${t('sc.flash')} aria-pressed=${torch} onClick=${flash}><${Icon} n=${torch ? 'flash_on' : 'flash_off'}/></button>`}
          ${live && html`<button type="button" class="sc-round" aria-label=${t('sc.flip')} onClick=${() => setFacing(facing === 'environment' ? 'user' : 'environment')}><${Icon} n="flip_camera_ios"/></button>`}</div></div>
      ${live ? html`<div class="sc-frame" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div><p class="sc-msg">${t('sc.hint')}</p>` : html`<div class="sc-frame" aria-hidden="true"></div><p class="sc-msg">${camMsg && t(camMsg)}</p>`}
      <div class="sc-bot">${live ? html`<button type="button" class="sc-shot" disabled=${busy} onClick=${() => scan(scFrame(vref.current))}><${Icon} n="center_focus_strong"/>${t('sc.scan')}</button>` : photoBtn}</div></div>
    ${read && html`<div class="sc-read"><${Icon} n="task_alt"/><span class="grow">${t('sc.read')}: <b><${Ltr}>${displayPlate(read.plate)}<//></b> · <${Ltr}>${t('sc.conf', { p: read.score })}<//></span></div>${read.score < 70 && html`<${Banner} variant="warning" title=${t('sc.low')}/>`}`}
    ${msg && html`<${Banner} variant="warning" title=${t(msg)} onDismiss=${() => setMsg('')} dismissLabel=${t('common.close')}/>`}
    <div class="stack" style="gap:var(--sp-sm)"><div class="sc-lbl"><label for="sc-plate">${t('sc.manual')}</label><em>${t('sc.exact')}</em></div>
      <div class="sc-row"><div class="sc-plate"><span class="sc-gb" dir="ltr">GB</span>
        <input id="sc-plate" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10" placeholder=${t('sc.reg_ph')} value=${val}
          onInput=${e => { setVal(e.target.value.toUpperCase()); setRead(null); }} onKeyDown=${e => { if (e.key === 'Enter') find(val); }}/>
        ${val && html`<button type="button" class="x" aria-label=${t('sc.clear_input')} onClick=${() => { setVal(''); setRes(null); setRead(null); setMsg(''); }}><${Icon} n="cancel"/></button>`}</div>
        <${Button} variant=${items.length ? 'secondary' : 'primary'} full=${false} large=${emp} disabled=${busy} onClick=${() => find(val)}>${t('sc.find')}<//></div></div>
    ${recent.length > 0 && html`<div class="sc-rec"><div class="top"><span class="sc-lbl">${t('sc.recent')}</span><button type="button" class="dir-link" onClick=${() => setRecent(scForget())}>${t('sc.clear')}</button></div>
      <div class="dir-chips">${recent.map(r => html`<${Chip} key=${r} onClick=${() => { setVal(r); setRead(null); find(r); }}><${Ltr}>${displayPlate(r)}<//><//>`)}</div></div>`}
    ${busy && !res && html`<${Skeleton} style="height:120px" aria-label=${t('common.loading')}/>`}
    ${res && items.length > 0 && html`<span class="sc-lbl">${t('sc.matched', { n: items.length })}</span>${items.map(c => html`<${ScCar} key=${c.id} c=${c} photo=${D.photos[c.main_photo_path]}/>`)}`}
    ${res && items.length === 0 && html`<div class="sc-nf"><span class="ic"><${Icon} n="help_outline"/></span><div class="bd"><b>${t('sc.nf_t')} <${Ltr}>${displayPlate(res.plate)}<//></b><p class="cap">${mgmt ? t('sc.nf_m') : t('sc.nf_d')}</p>
      ${mgmt && html`<${Button} variant="secondary" full=${false} onClick=${() => { ciSet({ plate: res.plate }); location.hash = '#/checkin'; }}><${Icon} n="add_circle_outline"/>${t('sc.add')}<//>`}</div></div>`}
  </div>`;
};
/* @@END: page-scan */

/* @@MODULE: app-shell | step 09 */
// Role routes (real protection stays RLS). A route a role may not open shows that role's home directly (never a blank page).
const ROLE_NAV = {
  management: [{ key: '#/home', label: 'nav.home', icon: 'dashboard' }, { key: '#/cars', label: 'nav.cars', icon: 'directions_car' }, { key: '#/staff', label: 'nav.staff', icon: 'groups' }, { key: '#/settings', label: 'nav.settings', icon: 'settings' }, { key: '#/account', label: 'nav.account', icon: 'person' }, { key: '#/backup', label: 'nav.backup', icon: 'cloud_download' }],
  supervisor: [{ key: '#/board', label: 'nav.board', icon: 'view_kanban' }, { key: '#/cars', label: 'nav.cars', icon: 'directions_car' }, { key: '#/departments', label: 'nav.departments', icon: 'apartment' }, { key: '#/account', label: 'nav.account', icon: 'person' }],
  employee: [{ key: '#/tasks', label: 'nav.queue', icon: 'format_list_bulleted' }, { key: '#/progress', label: 'nav.progress', icon: 'play_circle' }, { key: '#/completed', label: 'nav.completed', icon: 'check_circle' }, { key: '#/account', label: 'nav.account', icon: 'person' }]
};
const App = () => {
  useLang();
  const S = useSession(), online = useOnline(), wide = useWide(), nf = useNF();
  const [hash, setHash] = useState(location.hash);
  useEffect(() => { const f = () => setHash(location.hash); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  const role = S.profile && S.profile.role;
  const nav = ROLE_NAV[role] || ROLE_NAV.employee;
  const carId = (hash.match(/^#\/car\/([0-9a-fA-F-]{36})$/) || [])[1], isCar = !!carId;
  const taskId = (hash.match(/^#\/task\/([0-9a-fA-F-]{36})$/) || [])[1], isTask = !!taskId && role === 'employee';
  const route = isCar || isTask || (hash === '#/checkin' && role === 'management') || hash === '#/notifications' || hash === '#/scan' || nav.some(n => n.key === hash) ? hash : nav[0].key;
  useEffect(() => { if (S.status === 'in' && route !== hash) history.replaceState(null, '', route); });
  if (S.status === 'loading') return html`<div class="shell"><main class="body"><${Skeleton} style="height:120px" aria-label=${t('common.loading')}/></main></div>`;
  if (S.status !== 'in') return html`<${LoginPage} error=${S.error}/>`;
  const items = nav.map(n => ({ key: n.key, icon: n.icon, label: t(n.label) }));
  const isCI = route === '#/checkin', isScan = route === '#/scan', activeKey = isCI || ((isCar || isScan) && role !== 'employee') ? '#/cars' : isTask || isCar || isScan ? (EM_KEY[EM.tab] || '#/tasks') : route;
  const title = route === '#/home' && !isCar && !isTask && !isCI ? t('dash.title') : isCI ? t('ci.title') : route === '#/scan' ? t('sc.title') : route === '#/notifications' ? t('nf.title') : isCar ? t('cd.title') : isTask ? t('tk.title') : t(nav.find(n => n.key === route).label);
  const go = k => { location.hash = k; };
  const page = html`<div class="stack">
    ${!online && html`<${Banner} variant="warning" title=${t('net.offline')}>${t('net.offline_desc')}<//>`}
    <${LiveHost}/>
    ${isCI ? html`<${CheckinPage}/>` : route === '#/scan' ? html`<${ScanPage}/>` : isCar ? (role === 'employee' ? html`<${EmployeeCarPage} id=${carId}/>` : html`<${CarDetailPage} id=${carId}/>`) : isTask ? html`<${TaskPage} id=${taskId}/>` : route === '#/tasks' ? html`<${EmployeeListPage} tab="queue"/>` : route === '#/progress' ? html`<${EmployeeListPage} tab="progress"/>` : route === '#/completed' ? html`<${EmployeeListPage} tab="completed"/>` : route === '#/board' ? html`<${BoardPage}/>` : route === '#/departments' ? html`<${DepartmentsPage}/>` : route === '#/cars' ? html`<${DirectoryPage}/>` : route === '#/home' ? html`<${DashboardPage}/>` : route === '#/staff' ? html`<${StaffPage}/>` : route === '#/settings' ? html`<${SettingsPage}/>` : route === '#/notifications' ? html`<${NotificationsPage}/>` : route === '#/backup' ? html`<${BackupPage}/>` : route === '#/account' ? html`<${AccountPage}/>` : html`<${EmptyState} icon="construction" title=${t('later.title')} description=${t('later.desc')} action=${role === 'management' ? html`<${Button} full=${false} onClick=${() => go('#/checkin')}>${t('ci.add_car')}<//>` : null}/>`}</div>`;
  if (role === 'management' && wide) return html`<${DesktopShell} brandName=${t('app.name')} brandSubtitle=${t('role.management')} menuLabel=${t('common.menu')} navItems=${items} activeKey=${activeKey} onNavSelect=${go} topBar=${html`<h1 class="sect">${title}</h1><span class="grow"></span><${IconButton} icon="notifications" label=${t('common.notifications')} dot=${nf.unread > 0} onClick=${() => go('#/notifications')}/>`}>${page}<//>`;
  if (role === 'employee') return html`<${EmployeeShell} appName=${t('app.name')} departmentName=${deptName(S.dept)} bellLabel=${t('common.notifications')} hasAlert=${nf.unread > 0} onBell=${() => go('#/notifications')} navItems=${items} activeKey=${activeKey} onNavSelect=${go}>${page}<//>`;
  return html`<${MobileShell} title=${title} bellLabel=${t('common.notifications')} hasAlert=${nf.unread > 0} onBell=${() => go('#/notifications')} navItems=${items} activeKey=${activeKey} onNavSelect=${go}>${page}<//>`;
};
/* @@END: app-shell */

/* @@MODULE: router | step 09 */
// Routing now lives in app-shell (role routes). Nothing else here.
/* @@END: router */

/* @@MODULE: boot | step 01 */
// Step 09: no default hash needed; App renders the role home directly. Session is loaded right after the first render.
// Step 02: a failure must show a message, never a blank screen (rules section 11-4).
const showFatal = m => {
  const b = document.createElement('div');
  b.setAttribute('role', 'alert');
  b.style.cssText = 'position:fixed;inset-inline:0;inset-block-end:0;z-index:99;padding:12px 16px;background:#FBEAE8;color:#C2453D;font:500 13px/18px Inter,system-ui,sans-serif;direction:ltr;white-space:pre-wrap';
  b.textContent = 'Something went wrong: ' + m;
  document.body.appendChild(b);
};
window.addEventListener('error', e => showFatal(e.message));
window.addEventListener('unhandledrejection', e => showFatal((e.reason && e.reason.message) || String(e.reason)));
try { render(html`<${App}/>`, document.getElementById('root')); } catch (e) { showFatal(e.message); }
loadProfile().catch(() => sessionSet({ status: 'out', profile: null, dept: null, error: 'net.error' }));
/* @@END: boot */
</script>
</body>
